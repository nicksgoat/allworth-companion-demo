name: AllworthSwiftUI
options:
  bundleIdPrefix: com.allworth.companion
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  AllworthSwiftUI:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Fonts
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Allworth
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - PlayfairDisplay_700Bold.ttf
          - PlayfairDisplay_600SemiBold.ttf
          - PlayfairDisplay_600SemiBold_Italic.ttf
          - Lato_400Regular.ttf
          - Lato_400Regular_Italic.ttf
          - Lato_700Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allworth.companion.swiftui
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
