app = "allworth-demo-api"
primary_region = "dfw"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Keep one machine warm — no cold starts during the demo
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
