server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Proxy API requests to backend
    # BACKEND_HOST will be replaced at container startup
    location /api/ {
        proxy_pass http://BACKEND_HOST:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass App Service Authentication ("Easy Auth") identity through so the
        # backend can authenticate the request when no Bearer token is present.
        proxy_set_header X-Ms-Client-Principal-Name $http_x_ms_client_principal_name;
        proxy_set_header X-Ms-Client-Principal $http_x_ms_client_principal;

        # Accept compressed responses from Flask
        proxy_set_header Accept-Encoding "gzip";

        # Buffer responses so the backend connection is released quickly
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Increase timeouts for Synapse queries and NFBC confirm (rollforward SPs).
        # Azure App Service front-end caps requests at ~230s regardless.
        proxy_read_timeout 230s;
        proxy_connect_timeout 10s;
    }

    # Proxy Jarvis knowledge-base app (page + API) to backend
    # `^~` prevents the static-extension regex location from intercepting /jarvis/*.png etc.
    location ^~ /jarvis/ {
        proxy_pass http://BACKEND_HOST:5000/jarvis/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass SSO identity through so Jarvis can attribute edits
        proxy_set_header X-Ms-Client-Principal-Name $http_x_ms_client_principal_name;
        proxy_set_header X-User-Email $http_x_user_email;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
    # /jarvis (no trailing slash) → redirect for clean URL
    location = /jarvis {
        return 301 /jarvis/;
    }

    # Proxy Data Catalog app (page + API) to backend — same pattern as Jarvis.
    # `^~` keeps the static-extension regex location from intercepting
    # /catalog/static/*.js|css and the SPA catch-all from swallowing /catalog/.
    location ^~ /catalog/ {
        proxy_pass http://BACKEND_HOST:5000/catalog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass SSO identity through so metric/table edits are attributed
        proxy_set_header X-Ms-Client-Principal-Name $http_x_ms_client_principal_name;
        proxy_set_header X-User-Email $http_x_user_email;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
    # /catalog (no trailing slash) → redirect for clean URL
    location = /catalog {
        return 301 /catalog/;
    }

    # The Home hub is now a React route in the SPA (see frontend/src/Home.tsx),
    # so it shares the same SideNav rail and "view as" behavior as every other
    # page. Only the shared brand logo is still served by the Flask blueprint;
    # the exact-match location wins over both `^~` and `location /`.
    location = /home/logo.png {
        proxy_pass http://BACKEND_HOST:5000/home/logo.png;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
    # `/home` and `/home/` (the hub page) fall through to `location /` below,
    # which serves the SPA index.html so React Router renders the hub.

    # Proxy Fee Calculator API to backend
    location ^~ /fee-calculator/api/ {
        proxy_pass http://BACKEND_HOST:5000/fee-calculator/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow multi-MB billing file uploads (default nginx limit is 1MB → 413)
        client_max_body_size 64m;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Large billing uploads (first upload runs a heavy TAV lookup) can take
        # longer than the default 60s; allow generous processing time.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Proxy Pipeline Review API to backend
    location ^~ /pipeline-review/api/ {
        proxy_pass http://BACKEND_HOST:5000/pipeline-review/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Snapshot/trend reads run Synapse queries; allow headroom over the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Proxy Executive Report API to backend
    location ^~ /executive-report/api/ {
        proxy_pass http://BACKEND_HOST:5000/executive-report/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # First build runs heavy Synapse queries + a GPT-4.1 call; allow headroom.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Proxy Executive Brief API to backend
    location ^~ /brief/api/ {
        proxy_pass http://BACKEND_HOST:5000/brief/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass App Service Authentication ("Easy Auth") identity through so the
        # backend can attribute actions to the signed-in user, plus the Easy
        # Auth token-store Graph token (present once the token store is enabled
        # and Mail.Read is consented) for future delegated mailbox reads.
        proxy_set_header X-Ms-Client-Principal-Name $http_x_ms_client_principal_name;
        proxy_set_header X-Ms-Client-Principal $http_x_ms_client_principal;
        proxy_set_header X-Ms-Token-Aad-Access-Token $http_x_ms_token_aad_access_token;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Future live mode calls Graph + Claude server-side; allow headroom.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy Mailer API to backend — reusable send API for pipelines/automation.
    # Callers (e.g. a Synapse Web activity) authenticate with a managed-identity
    # bearer token, validated by Easy Auth + the JWT middleware like any tool.
    location ^~ /mailer/api/ {
        proxy_pass http://BACKEND_HOST:5000/mailer/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through SSO/identity headers for audit attribution.
        proxy_set_header X-Ms-Client-Principal-Name $http_x_ms_client_principal_name;
        proxy_set_header X-Ms-Client-Principal $http_x_ms_client_principal;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # The root path serves the SPA — React Router renders the Home hub at `/`
    # (see frontend/src/Home.tsx). It falls through to `location /` below, whose
    # `try_files … /index.html` returns the SPA shell.

    # Serve static files - HTML should never be cached
    location / {
        try_files $uri $uri/ /index.html;

        # Allow embedding in ThoughtSpot liveboards
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.thoughtspot.cloud https://*.thoughtspot.com" always;
    }

    # Explicitly prevent caching of index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets with content hashes (Vite adds hashes to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
