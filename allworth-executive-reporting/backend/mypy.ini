[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
warn_return_any = False
# New packages we authored get checked strictly; existing packages are excluded
# until they are gradually typed.
exclude = (?x)(
    ^app\.py$
    | ^delta_reader\.py$
    | ^nfbc/
    | ^sfp2/
    | ^repcodes/
    | ^fee_calculator/
    | ^executive_report/
    | ^pipeline_review/
    | ^brief/
    | ^catalog/
    | ^admin/
    | ^jarvis/
    | ^file_explorer/
    | ^mailer/
  )

[mypy-investments.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-email_batch.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-weasyprint.*]
ignore_missing_imports = True

# Pydantic's documented @computed_field + @property stack is not understood by mypy.
[mypy-investments.models.bond]
disable_error_code = prop-decorator
