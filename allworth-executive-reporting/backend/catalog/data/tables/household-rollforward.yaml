  one_to_one: true
  'on': '[Household_Rollforward::Reporting Period] = [Term_Prediction_Probability::Reporting Period] AND
    [Household_Rollforward::avhhid] = [Term_Prediction_Probability::avhhid]'
  pairs:
  - from_table: Household_Rollforward
