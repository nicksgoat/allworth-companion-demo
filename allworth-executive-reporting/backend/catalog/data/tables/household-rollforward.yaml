    from_col: avhhid
    to_table: Current_Household_Demographic
    to_col: AVHHID
- join_name: HH RF to Historical HH
  to: Historical_Household_Demographic
  to_id: historical-household-demographic
  type: LEFT_OUTER
  one_to_one: true
  'on': '[Household_Rollforward::Reporting Period] = [Historical_Household_Demographic::Reporting Period]
    AND [Household_Rollforward::avhhid] = [Historical_Household_Demographic::avhhid]'
  pairs:
  - from_table: Household_Rollforward
    from_col: Reporting Period
    to_table: Historical_Household_Demographic
    to_col: Reporting Period
  - from_table: Household_Rollforward
    from_col: avhhid
