relationships:
- join_name: Current_Household_Demographic_to_Campaign
  to: Campaign
  to_id: campaign
  type: LEFT_OUTER
  one_to_one: false
  'on': '[Current_Household_Demographic::waived_fee_promo_Id] = [Campaign::Id]'
  pairs:
  - from_table: Current_Household_Demographic
    from_col: waived_fee_promo_Id
    to_table: Campaign
    to_col: Id
- join_name: HH to Acquisition Table
  to: Acquisition
  to_id: acquisition
  type: LEFT_OUTER
  one_to_one: false
  'on': '[Current_Household_Demographic::Acquisition_Source] = [Acquisition::AcqCode]'
  pairs:
  - from_table: Current_Household_Demographic
    from_col: Acquisition_Source
    to_table: Acquisition
    to_col: AcqCode
