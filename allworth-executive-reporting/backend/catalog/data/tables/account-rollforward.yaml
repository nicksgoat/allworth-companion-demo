relationships:
- join_name: Acct RF to ACV
  to: Current_Account_Demographic
  to_id: current-account-demographic
  type: LEFT_OUTER
  one_to_one: false
  'on': '[Account_Rollforward::avaccountuploadid] = [Current_Account_Demographic::Upload Account ID]'
  pairs:
  - from_table: Account_Rollforward
    from_col: avaccountuploadid
    to_table: Current_Account_Demographic
    to_col: Upload Account ID
- join_name: Acct RF to Current HH
  to: Current_Household_Demographic
  to_id: current-household-demographic
  type: LEFT_OUTER
  one_to_one: false
  'on': '[Account_Rollforward::avhhid] = [Current_Household_Demographic::AVHHID]'
  pairs:
  - from_table: Account_Rollforward
    from_col: avhhid
    to_table: Current_Household_Demographic
    to_col: AVHHID
- join_name: Acct RF to Historical HH
  to: Historical_Household_Demographic
  to_id: historical-household-demographic
  type: LEFT_OUTER
  one_to_one: false
  'on': '[Account_Rollforward::avhhid] = [Historical_Household_Demographic::avhhid] AND [Account_Rollforward::Reporting
    Period] = [Historical_Household_Demographic::Reporting Period]'
  pairs:
  - from_table: Account_Rollforward
    from_col: avhhid
    to_table: Historical_Household_Demographic
    to_col: avhhid
  - from_table: Account_Rollforward
    from_col: Reporting Period
    to_table: Historical_Household_Demographic
    to_col: Reporting Period
