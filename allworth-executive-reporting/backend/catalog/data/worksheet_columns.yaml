      Start Date] >= [1st Appt Set::Date] ) then ( diff_weeks ( [1st Appt Set::Date] , today ( ) ) = -
      1 ) else if ( [Activity Avg Date] = 'this week' and [formula_Event Start Date] >= [1st Appt Set::Date]
      ) then ( diff_weeks ( [1st Appt Set::Date] , today ( ) ) = 0 ) else if ( [Activity Avg Date] = 'last
      month' and [formula_Event Start Date] >= [1st Appt Set::Date] ) then ( diff_months ( [1st Appt Set::Date]
      , today ( ) ) = - 1 ) else if ( [Activity Avg Date] = 'this month' and [formula_Event Start Date]
      >= [1st Appt Set::Date] ) then ( diff_months ( [1st Appt Set::Date] , today ( ) ) = 0 ) else if
      ( [Activity Avg Date] = 'last year' and [formula_Event Start Date] >= [1st Appt Set::Date] ) then
      ( diff_years ( [1st Appt Set::Date] , today ( ) ) = - 1 ) else if ( [Activity Avg Date] = 'this
      year' and [formula_Event Start Date] >= [1st Appt Set::Date] ) then ( diff_years ( [1st Appt Set::Date]
      , today ( ) ) = 0 ) else if ( [Activity Avg Date] = 'last 30 days' and [formula_Event Start Date]
      >= [1st Appt Set::Date] ) then ( diff_days ( [1st Appt Set::Date] , today ( ) ) >= - 30 and diff_days
      ( [Lead Created Date::Date] , today ( ) ) <= 0 ) else null } )
