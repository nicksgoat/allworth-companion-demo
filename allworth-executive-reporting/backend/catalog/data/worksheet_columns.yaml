- name: Manager
  worksheets:
  - Advisor 360
  - Jira FSI
  sources:
  - table: User
    column: Manager
    table_id: user
  formulas:
  - expr: 'if ( [Jira::Investment_Team_Product_Category] = ''55ip (Tax-Smart Trading)'' ) then ''55ip''
      else if ( [Jira::Investment_Team_Product_strategy] in { ''AQR Integrated Flex 145/45'' , ''AQR Integrated
      Flex 200/100'' , ''AQR Integrated Flex 250/150'' , ''AQR Concentrated Stock Flex 200/100'' , ''AQR
      Concentrated Stock Flex 250/100'' } or ( [Jira::Investment_Team_Product_Category] = ''SMA: AQR''
      ) ) then ''AQR'' else if ( [Jira::Investment_Team_Product_strategy] in { ''Remove SpiderRock - In-House
      Stock Options'' , ''Remove Blackrock - In-House Bond Ladders'' , ''In-House Stock Options (Setup)''
      , ''Remove BlackRock and bring bond ladder trading to our in-house team'' } or ( [Jira::Investment_Team_Product_Category]
      in { ''Remove an SMA from an account (other than bringing in-house BlackRock or SpiderRock strategies)''
      , ''Remove BlackRock and bring bond ladder trading to our in-house team'' , ''Remove SpiderRock
      and bring option trading to our in-house team'' } ) ) then ''Allworth'' else if ( [Jira::Investment_Team_Product_strategy]
      in { ''AMG Pantheon Fund, LLC (Class 1)'' , ''Blackstone Private Credit Fund (Class I)'' , ''Bluerock
      1031 DST'' , ''CAIS North Rock Fund, LLC (Class A)'' , ''Clarion Ventures QOZ Partners (Series G)''
      , ''KKR Infrastructure Conglomerate (Class I)'' , ''KKR Private Equity Conglomerate (Class R-I)''
      , ''Allworth Core Alternative Model'' , ''Allworth Yield Alternative Model'' , ''Apollo Debt Solutions
      (Class I)'' , ''Apollo Realty Solutions (Class I)'' , ''Blue Owl Credit Income (Class I)'' , ''Monroe
      Captial Income Plus (Advisory)'' , ''AQR TA Delphi Plus (Class A)'' , ''Allworth Core Model'' }
      or ( [Jira::Investment_Team_Product_Category] = ''Alternative Assets (via CAIS)'' ) ) then ''Alternative
      Assets (via CAIS)'' else if ( [Jira::Investment_Team_Product_strategy] in { ''Aperio Total US Market
      (Russel 3000)'' , ''Aperio US Dividend (S&P 500 Value w/1.5x Divident Tilt)'' , ''Aperio US Large
      Cap (S&P 500)'' , ''Aperio Global ex US (75% MSCI EAFE / 25% MSCI EM)'' , ''Aperio Total Equity
      (80% US Market/20% Global Ex.US)'' , ''SMA: Aperio Direct Index'' } or ( [Jira::Investment_Team_Product_Category]
      in { ''Aperio'' , ''SMA: Aperio Direct Index'' } ) ) then ''Aperio'' else if ( [Jira::Investment_Team_Product_strategy]
      in { ''Blackrock Corporate FI Ladder 1-5 YR'' , ''Blackrock Corporate FI Ladder 1-10 YR'' , ''Blackrock
      Muni FI Ladder 1-5 YR'' , ''Blackrock Muni FI Ladder 1-10 YR'' , ''Blackrock Muni FI Ladder 5-15
      YR'' , ''Blackrock Muni FI Ladder 10-20 YR'' , ''Blackrock Intermediate Municipal Fixed Income''
      , ''Blackrock Intermediate Taxable Fixed Income'' } or ( [Jira::Investment_Team_Product_Category]
      = ''SMA: Blackrock Bond Ladder'' ) ) then ''Blackrock'' else if ( [Jira::Investment_Team_Product_strategy]
      in { ''JPMorgan Large Cap US Leaders (Taxable Account)'' , ''JPMorgan Large Cap US Leaders (Non-Taxable
      Account)'' , ''SMA: JP Morgan Large Cap US Leaders (non-taxable account)'' , ''SMA: JP Morgan Large
      Cap US Leaders (taxable account)'' } or ( [Jira::Investment_Team_Product_Category] in { ''SMA: JP
      Morgan Large Cap US Leaders (non-taxable account)'' , ''SMA: JP Morgan Large Cap US Leaders (taxable
      account)'' } ) ) then ''JPMorgan'' else if ( [Jira::Investment_Team_Product_strategy] in { ''Legacy
      SMA via Acquisition '' , ''Legacy Alternative Investment via Acquisition'' , ''SMA Removal'' , ''Envestnet
      UMA'' } ) then ''Other'' else if ( [Jira::Investment_Team_Product_strategy] in { ''SpiderRock Hedged
      Equity Concentrated Stock - Covered Calls'' , ''SpiderRock Hedged Equity Portfolio - Collar'' ,
      ''SpiderRock Managed Index Income'' , ''SpiderRock Hedged Equity Concentrated Stock - Collar'' ,
      ''SpiderRock Exchange Fund Replication'' , ''SpiderRock Hedged Equity Concentrated Stock - Covered
      Calls; Strategic Liquidation'' , ''SpiderRock Hedged Equity Concentrated Stock - Collar; Strategic
      Liquidation'' , ''SpiderRock Exchange Fund Replication; Strategic Liquidation'' , ''SpiderRock''
      , ''Stock Options; Allworth-Managed Setup and Trading (not SpiderRock)'' , ''Stock Options; SpiderRock
      Stock Options'' } or ( [Jira::Investment_Team_Product_Category] in { ''SpiderRock'' , ''Stock Options;
      Allworth-Managed Setup and Trading (not SpiderRock)'' , ''Stock Options; SpiderRock Stock Options''
      } ) ) then ''SpiderRock'' else ''other'''
    worksheet: Jira FSI
  descriptions: []
