      market' } or isnull ( [Historical_Household_Demographic::Channel_Middle]  ) ) then 'media driven'
      else if ( [Historical_Household_Demographic::Channel_Middle] in { 'referral' , 'other' , 'self-sourced'
      , 'promoter' , 'beneficiary' } ) then 'advisor driven' else if ( [Historical_Household_Demographic::Channel_Middle]
      in { 'fidelity' , 'schwab' } ) then 'crp' else [Historical_Household_Demographic::Channel_Middle]
    worksheet: Rollforward Historical
  - expr: if ( [Current_Household_Demographic::Channel_Middle] in { 'radio' , 'other media' , 'target
      market' } ) then 'media driven' else [Current_Household_Demographic::Channel_Middle]
