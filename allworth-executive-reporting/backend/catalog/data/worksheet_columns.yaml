      ) = false ) then - diff_years ( to_date ( [Current_Household_Fact::ClientSince] , '%M-%D-%Y' ) ,
      today ( ) ) else if ( isnull ( [Current_Household_Fact::term_date] ) = false and isnull ( [Current_Household_Fact::ClientSince]
      ) = false ) then - diff_years ( to_date ( [Current_Household_Fact::ClientSince] , '%M-%D-%Y' ) ,
      to_date ( [Current_Household_Fact::term_date] , '%M-%D-%Y' ) ) else null
    worksheet: Allworth 360
  - expr: diff_years ( [Historical_Household_Demographic::Reporting Period] , to_date ( [Current_Household_Fact::ClientSince]
      , '%M-%D-%Y' ) )
