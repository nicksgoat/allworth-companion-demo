      , 'promoter' , 'beneficiary' } ) then 'advisor driven' else if ( [Current_Household_Demographic::Channel_Middle]
      in { 'fidelity' , 'schwab' } ) then 'crp' else [Current_Household_Demographic::Channel_Middle]
    worksheet: Activities
  - expr: if ( [Historical_Household_Demographic::Channel_Middle] in { 'radio' , 'other media' , 'target
