  formulas:
  - expr: if ( [Current_Household_Demographic::Target Market Flag] = true and [Current_Household_Demographic::Division]
      = 'airline' ) then 'Airline' else if ( [Current_Household_Demographic::Employer] = 'pg&e' ) then
      'PG&E' else if ( [Current_Household_Demographic::Target Market Flag] = true and contains ( [Current_Household_Demographic::Employer]
      , 'dental' ) ) then 'Dental' else if ( [Current_Household_Demographic::Target Market Flag] = true
      and [Current_Household_Demographic::Employer] not in { 'aal' , 'aka' , 'dal' , 'delta' , 'dental
      office' , 'fedex' , 'frontier' , 'jetblue' , 'other airline' , 'pg&e' , 'spirit' , 'swa' , 'ual'
      , 'ups' } and ( [Current_Household_Demographic::Division] = 'other target market' or isnull ( [Current_Household_Demographic::Division]
      ) ) ) then 'Other Target Market' else null
    worksheet: Performance Tracking
