  sources: []
  formulas:
  - expr: if ( [formula_Client Age] < 40 ) then '40-' else if ( [formula_Client Age] < 50 and [formula_Client
      Age] >= 40 ) then '40-50' else if ( [formula_Client Age] < 60 and [formula_Client Age] >= 50 ) then
      '50-60' else if ( [formula_Client Age] < 70 and [formula_Client Age] >= 60 ) then '60-70' else if
      ( [formula_Client Age] < 80 and [formula_Client Age] >= 70 ) then '70-80' else if ( isnull ( [formula_Client
      Age] ) ) then 'no age specified' else '80+'
    worksheet: Allworth 360
  - expr: if ( [formula_Client Age] < 40 ) then '<40' else if ( [formula_Client Age] < 50 and [formula_Client
      Age] >= 40 ) then '40-50' else if ( [formula_Client Age] < 60 and [formula_Client Age] >= 50 ) then
      '50-60' else if ( [formula_Client Age] < 70 and [formula_Client Age] >= 60 ) then '60-70' else '70+'
    worksheet: Comparison 360
  - expr: if ( [RF_Part1::Client Age] >= 60 ) then '60+' else '<60'
    worksheet: RF Column View 12-31-2025
  - expr: if ( [formula_Age] < 40 ) then '40-' else if ( [formula_Age] < 50 and [formula_Age] >= 40 )
      then '40-50' else if ( [formula_Age] < 60 and [formula_Age] >= 50 ) then '50-60' else if ( [formula_Age]
      < 70 and [formula_Age] >= 60 ) then '60-70' else if ( [formula_Age] < 80 and [formula_Age] >= 70
      ) then '70-80' else '80+'
