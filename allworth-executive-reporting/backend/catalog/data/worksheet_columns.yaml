  sources: []
  formulas:
  - expr: if ( [formula_PE - Keep Records] = 'keep' ) then 'include' else if ( not isnull ( [formula_PE
      - Delete Extra Records] ) ) then 'exclude' else if ( ( [Advisor::Name] = 'kyle hatten' and month
      ( [Lead_Created_Date::Date] ) = 'April' and year ( [Lead_Created_Date::Date] ) = 2022 and ( [formula_Channel]
      = 'advisor driven' or [Current_Household_Demographic::Channel_Middle] = 'other media' ) ) or ( [Advisor::Name]
      = 'kyle hatten' and month ( [Lead_Created_Date::Date] ) = 'May' and year ( [Lead_Created_Date::Date]
      ) = 2022 and ( [formula_Channel] = 'advisor driven' or [Current_Household_Demographic::Channel_Middle]
      = 'other media' ) ) or ( [Advisor::Name] = 'kyle hatten' and month ( [Lead_Created_Date::Date] )
      = 'october' and year ( [Lead_Created_Date::Date] ) = 2022 and ( [formula_Channel] = 'advisor driven'
      or [Current_Household_Demographic::Channel_Middle] = 'other media' ) ) or ( [Advisor::Name] = 'Hubspot
      Integration2' and [Lead_Created_Date::Month] = 6 and [Lead_Created_Date::Year] = 2024 and ( [formula_Channel]
      = 'advisor driven' ) ) ) then 'exclude' else 'include'
    worksheet: Allworth 360
  - expr: if ( [formula_PE - Keep Records] = 'keep' ) then 'include' else if ( not isnull ( [formula_PE
      - Delete Extra Records] ) ) then 'exclude' else if ( ( [Advisor::Name] = 'kyle hatten' and month
      ( [goals_20260109::Date] ) = 'April' and year ( [goals_20260109::Date] ) = 2022 and ( [goals_20260109::Channel_Core]
      = 'advisor driven' or [Current_Household_Demographic::Channel_Middle] = 'other media' ) ) or ( [Advisor::Name]
      = 'kyle hatten' and month ( [goals_20260109::Date] ) = 'May' and year ( [goals_20260109::Date] )
      = 2022 and ( [goals_20260109::Channel_Core] = 'advisor driven' or [Current_Household_Demographic::Channel_Middle]
      = 'other media' ) ) or ( [Advisor::Name] = 'kyle hatten' and month ( [goals_20260109::Date] ) =
      'october' and year ( [goals_20260109::Date] ) = 2022 and ( [goals_20260109::Channel_Core] = 'advisor
      driven' or [Current_Household_Demographic::Channel_Middle] = 'other media' ) ) or ( [Advisor::Name]
