  formulas:
  - expr: group_aggregate ( unique_count_if ( [Activity_Dim::Activity_Type] = 'event' and [Activity_Dim::Process_Type__c]
      in { '1st appointment' , 'introduction appointment' } , [Activity_Fact::Id] ) , query_groups ( )
      , query_filters ( ) + { if ( [Activity Count Date] = 'last week' ) then ( diff_weeks ( [Created
      Date::Date] , today ( ) ) = - 1 ) else if ( [Activity Count Date] = 'this week' ) then ( diff_weeks
      ( [Created Date::Date] , today ( ) ) = 0 ) else if ( [Activity Count Date] = 'last 30 days' ) then
      ( diff_days ( [Created Date::Date] , today ( ) ) = - 30 ) else if ( [Activity Count Date] = 'last
      month' ) then ( diff_months ( [Created Date::Date] , today ( ) ) = - 1 ) else if ( [Activity Count
      Date] = 'this month' ) then ( diff_months ( [Created Date::Date] , today ( ) ) = 0 ) else if ( [Activity
      Count Date] = 'last year' ) then ( diff_years ( [Created Date::Date] , today ( ) ) = - 1 ) else
      if ( [Activity Count Date] = 'this year' ) then ( diff_years ( [Created Date::Date] , today ( )
      ) = 0 ) else null } )
    worksheet: Activities
  descriptions: []
