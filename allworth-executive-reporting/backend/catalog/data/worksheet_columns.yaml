- name: Due Date Appt Count by Date
  worksheets:
  - Activities
  sources: []
  formulas:
  - expr: group_aggregate ( unique_count_if ( [Activity_Dim::Activity_Type] = 'event' , [Activity_Fact::Id]
      ) , query_groups ( ) , query_filters ( ) + { if ( [Activity Count Date] = 'last week' ) then ( diff_weeks
      ( [Due Date::Date] , today ( ) ) = - 1 ) else if ( [Activity Count Date] = 'this week' ) then (
      diff_weeks ( [Due Date::Date] , today ( ) ) = 0 ) else if ( [Activity Count Date] = 'last month'
      ) then ( diff_months ( [Due Date::Date] , today ( ) ) = - 1 ) else if ( [Activity Count Date] =
      'this month' ) then ( diff_months ( [Due Date::Date] , today ( ) ) = 0 ) else if ( [Activity Count
      Date] = 'last year' ) then ( diff_years ( [Due Date::Date] , today ( ) ) = - 1 ) else if ( [Activity
      Count Date] = 'this year' ) then ( diff_years ( [Due Date::Date] , today ( ) ) = 0 ) else null }
      )
    worksheet: Activities
  descriptions: []
