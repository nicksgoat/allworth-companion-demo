  - Rollforward Historical
  - Stage Change History
  sources:
  - table: RF_Part1
    column: Channel Detail
    table_id: rf-part1
  formulas:
  - expr: if ( [Current_Household_Demographic::Channel_Middle] = 'paid leads' and [Current_Household_Demographic::Lead
      Description] = 'Smart Asset' ) then 'Smart Asset' else if ( [Current_Household_Demographic::Channel_Middle]
      = 'paid leads' ) then 'Other' else if ( [Current_Household_Demographic::Channel_Middle] = 'crp'
      and isnull ( [Current_Household_Demographic::CRP_Custodian__c] ) ) then 'Fidelity' else if ( [Current_Household_Demographic::Channel_Middle]
      = 'crp' ) then [Current_Household_Demographic::CRP_Custodian__c] else if ( [Current_Household_Demographic::Channel_Middle]
      = 'advisor driven' ) then 'Advisor Driven' else if ( [Current_Household_Demographic::Channel_Middle]
      = 'other media' and [Current_Household_Demographic::Lead Source] in { "paid social" , "paid search"
      , "email marketing" , "web" , "social media" } ) then "Online" else if ( [Current_Household_Demographic::Channel_Middle]
      = 'other media' ) then "Branding" else [Current_Household_Demographic::Channel_Middle]
    worksheet: Allworth 360
  - expr: if ( [goals_20260109::Channel] = 'paid leads' and [Current_Household_Demographic::Lead Description]
      = 'Smart Asset' ) then 'Smart Asset' else if ( [goals_20260109::Channel] = 'paid leads' ) then 'Other'
      else if ( [Historical_Household_Demographic::Channel_Middle]  in { 'beneficiary' , 'other' , 'self-sourced'
      , 'referral' , 'promoter' } ) then 'Advisor Driven' else if ( [goals_20260109::Channel] = 'other
      media' and [Current_Household_Demographic::Lead Source] in { "paid social" , "paid search" , "email
      marketing" , "web" , "social media" } ) then "Online" else if ( [goals_20260109::Channel] = 'other
      media' ) then "Branding" else [goals_20260109::Channel]
    worksheet: Performance Tracking
  - expr: if ( [Projected_NCNM::channel_middle] = 'paid leads' and [Current_Household_Demographic::Lead
      Description] = 'Smart Asset' ) then 'Smart Asset' else if ( [Projected_NCNM::channel_middle] = 'paid
      leads' ) then 'Other' else if ( [Projected_NCNM::channel_middle] = 'crp' and isnull ( [Current_Household_Demographic::CRP_Custodian__c]
      ) ) then 'Fidelity' else if ( [Projected_NCNM::channel_middle] = 'crp' ) then [Current_Household_Demographic::CRP_Custodian__c]
      else if ( [Projected_NCNM::channel_middle] = 'advisor driven' ) then 'Advisor Driven' else if (
      [Projected_NCNM::channel_middle] = 'other media' and [Current_Household_Demographic::Lead Source]
      in { "paid social" , "paid search" , "email marketing" , "web" , "social media" } ) then "Online"
      else if ( [Projected_NCNM::channel_middle] = 'other media' ) then "Branding" else [Projected_NCNM::channel_middle]
    worksheet: Projected NCNM
  - expr: if ( [Historical_Household_Demographic::Channel_Middle] = 'paid leads' and [Current_Household_Demographic::Lead
      Description] = 'Smart Asset' ) then 'Smart Asset' else if ( [Historical_Household_Demographic::Channel_Middle]
      = 'paid leads' ) then 'Other' else if ( [Historical_Household_Demographic::Channel_Middle] in {
      'beneficiary' , 'other' , 'self-sourced' , 'referral' , 'promoter' } ) then 'Advisor Driven' else
      if ( [Historical_Household_Demographic::Channel_Middle] = 'other media' and [Current_Household_Demographic::Lead
      Source] in { "paid social" , "paid search" , "email marketing" , "web" , "social media" } ) then
      "Online" else if ( [Historical_Household_Demographic::Channel_Middle] = 'other media' ) then "Branding"
      else [Historical_Household_Demographic::Channel_Middle]
    worksheet: Rollforward Historical
