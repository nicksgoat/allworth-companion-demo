      ) , query_groups ( ) , query_filters ( ) + { if ( [Activity Count Date] = 'last week' ) then ( diff_weeks
      ( [Completed Date::Date] , today ( ) ) = - 1 ) else if ( [Activity Count Date] = 'this week' ) then
      ( diff_weeks ( [Completed Date::Date] , today ( ) ) = 0 ) else if ( [Activity Count Date] = 'last
