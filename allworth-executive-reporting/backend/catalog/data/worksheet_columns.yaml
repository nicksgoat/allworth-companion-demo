      market' } or isnull ( [Historical_Household_Demographic::Channel_Middle] ) ) then 'Media Driven'
      else if ( [Historical_Household_Demographic::Channel_Middle] in { 'referral' , 'other' , 'self-sourced'
      , 'promoter' , 'beneficiary' } ) then 'Advisor Driven' else if ( [Historical_Household_Demographic::Channel_Middle]
