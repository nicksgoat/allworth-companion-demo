- name: AUM Group
  worksheets:
  - Campaigns
  - Comparison 360
  - Download Version of 360
  - Rollforward Historical
  sources: []
  formulas:
  - expr: if ( [formula_AUM] <= 1000000 ) then '$0-$1m' else if ( [formula_AUM] > 1000000 and [formula_AUM]
      <= 3000000 ) then '$1m-$3m' else if ( [formula_AUM] > 3000000 ) then '$3m+' else null
    worksheet: Campaigns
  - expr: if ( [Current_Household_Fact::AUM] < 250000 ) then '< $250k' else if ( [Current_Household_Fact::AUM]
      >= 250000 and [Current_Household_Fact::AUM] < 500000 ) then '$250k - $500k' else if ( [Current_Household_Fact::AUM]
      >= 500000 and [Current_Household_Fact::AUM] < 1000000 ) then '$500k - $1m' else if ( [Current_Household_Fact::AUM]
      >= 1000000 and [Current_Household_Fact::AUM] < 2000000 ) then '$1m - $2m' else if ( [Current_Household_Fact::AUM]
      >= 2000000 and [Current_Household_Fact::AUM] < 5000000 ) then '$2m - $5m' else if ( [Current_Household_Fact::AUM]
      >= 5000000 and [Current_Household_Fact::AUM] < 10000000 ) then '$5m - $10m' else if ( [Current_Household_Fact::AUM]
      >= 10000000 and [Current_Household_Fact::AUM] < 25000000 ) then '$10m - $25m' else if ( [Current_Household_Fact::AUM]
      > 25000000 ) then '>$25m' else null
    worksheet: Comparison 360
  - expr: if ( [Household_Rollforward::Total Account Value] <= 1000000 ) then '$0-$1m' else if ( [Household_Rollforward::Total
      Account Value] > 1000000 and [Household_Rollforward::Total Account Value] <= 3000000 ) then '$1m-$3m'
      else if ( [Household_Rollforward::Total Account Value] > 3000000 ) then '$3m+' else null
    worksheet: Rollforward Historical
  descriptions: []
