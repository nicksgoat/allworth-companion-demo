      else if ( [Flow Type] = 'attrition' ) then [Household_Rollforward::Attrition] else if ( [Flow Type]
      = 'net flows' ) then [formula_Net Flows] else if ( [Flow Type] = 'inflows' ) then [formula_Organic
      Inflows] else if ( [Flow Type] = 'outflows' ) then [formula_Outflows] else null
