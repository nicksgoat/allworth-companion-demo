      ( diff_weeks ( [Created Date::Date] , today ( ) ) = 0 ) else if ( [Activity Count Date] = 'last
      30 days' ) then ( diff_days ( [Created Date::Date] , today ( ) ) = - 30 ) else if ( [Activity Count
      Date] = 'last month' ) then ( diff_months ( [Created Date::Date] , today ( ) ) = - 1 ) else if (
      [Activity Count Date] = 'this month' ) then ( diff_months ( [Created Date::Date] , today ( ) ) =
      0 ) else if ( [Activity Count Date] = 'last year' ) then ( diff_years ( [Created Date::Date] , today
      ( ) ) = - 1 ) else if ( [Activity Count Date] = 'this year' ) then ( diff_years ( [Created Date::Date]
      , today ( ) ) = 0 ) else null } )
