- name: Tenure Group
  worksheets:
  - Allworth 360
  - Comparison Rollforward - Trade Date
  - Download Version of 360
  - Rollforward Historical
  - Trade Date Rollforward
  sources: []
  formulas:
  - expr: if ( [formula_Tenure] <= 1 or [formula_Tenure] = 0 ) then '0-1 year' else if ( [formula_Tenure]
      >= 1 and [formula_Tenure] <= 2 ) then '1-2 years' else if ( [formula_Tenure] >= 3 and [formula_Tenure]
      <= 6 ) then '3-6 years' else if ( [formula_Tenure] > 6 and [formula_Tenure] < 11 ) then '7-10 years'
      else if ( [formula_Tenure] >= 11 ) then '10+ years' else null
    worksheet: Allworth 360
  - expr: if ( [Historical_Household_Demographic_1::tenure] <= 1 or [Historical_Household_Demographic_1::tenure]
      = 0 ) then '0-1 year' else if ( [Historical_Household_Demographic_1::tenure] >= 1 and [Historical_Household_Demographic_1::tenure]
      <= 2 ) then '1-2 years' else if ( [Historical_Household_Demographic_1::tenure] >= 3 and [Historical_Household_Demographic_1::tenure]
      <= 6 ) then '3-6 years' else if ( [Historical_Household_Demographic_1::tenure] > 6 and [Historical_Household_Demographic_1::tenure]
      < 11 ) then '7-10 years' else if ( [Historical_Household_Demographic_1::tenure] >= 11 ) then '10+
      years' else null
    worksheet: Comparison Rollforward - Trade Date
  - expr: if ( [formula_Tenure] = 0 or [formula_Tenure] = 1 ) then '0-1 year' else if ( [formula_Tenure]
      = 2 or [formula_Tenure] = 3 ) then '2-3 years' else if ( [formula_Tenure] > 3 and [formula_Tenure]
      <= 6 ) then '3-6 years' else if ( [formula_Tenure] > 6 and [formula_Tenure] < 11 ) then '7-10 years'
      else if ( [formula_Tenure] >= 11 ) then '10+ years' else if ( [formula_Tenure] < 0 ) then '-1' else
      null
    worksheet: Rollforward Historical
  - expr: if ( [Historical_Household_Demographic::tenure] <= 1 or [Historical_Household_Demographic::tenure]
      = 0 ) then '0-1 year' else if ( [Historical_Household_Demographic::tenure] >= 1 and [Historical_Household_Demographic::tenure]
      <= 2 ) then '1-2 years' else if ( [Historical_Household_Demographic::tenure] >= 3 and [Historical_Household_Demographic::tenure]
      <= 6 ) then '3-6 years' else if ( [Historical_Household_Demographic::tenure] > 6 and [Historical_Household_Demographic::tenure]
      < 11 ) then '7-10 years' else if ( [Historical_Household_Demographic::tenure] >= 11 ) then '10+
      years' else null
    worksheet: Trade Date Rollforward
  descriptions: []
