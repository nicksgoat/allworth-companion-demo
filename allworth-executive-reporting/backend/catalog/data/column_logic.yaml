    ua.Id\"), \"left\") \\\n    .where((col(\"a.client_since_date__c\").isNotNull()) &\n           (col(\"\
    a.term_date__C\").isNull()) &\n           (col(\"a.FinServ__Status__c\").like(\"%Current%\"))) \\\n\
    \    .groupBy(\"ua.Name\") \\\n    .agg(countDistinct(\"a.Id\").alias(\"Current_Clients\")) \\\n \
    \   .withColumnRenamed(\"Name\", \"Advisor\")\n\n# Compute leads DataFrame\nleads_metrics_df = leads_df.alias(\"\
    l\") \\\n    .join(contacts_df.alias(\"c\"), col(\"l.Id\") == col(\"c.Converted_Lead_Id__c\"), \"\
    left\") \\\n    .join(accounts_df.alias(\"a\"), col(\"l.ConvertedHouseholdId__c\") == col(\"a.Id\"\
    ), \"left\") \\\n    .join(usertable_df.alias(\"ra\"), col(\"l.FinServ__ReferredByUser__c\") == col(\"\
