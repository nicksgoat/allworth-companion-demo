  notebook: tho_Account_Rollforward
  source_systems: *id002
  expression: "tav_transactions_df\n    .join(F.broadcast(acv_account_universe), [\"avaccountuploadid\"\
    ], \"inner\")\n    .where(F.col(\"intra_group_flow\").isNull() | (F.col(\"intra_group_flow\") == \"\
    \"))\n    .withColumn(\"entry_dt\", F.to_date(F.col(\"entry_date\")))\n    .where(F.col(\"entry_dt\"\
    ) > F.lit(startdate))\n    .where(F.col(\"entry_dt\") <= F.lit(currdate))\n    .withColumn(\n    \
    \    \"avactivitytype\",\n        F.when(F.col(\"activity_type\").rlike(\"(?i)Transfer\"), \"Transfer\
    \ of Securities\")\n        .when(F.col(\"activity_type\").rlike(\"(?i)Expense\") & ~F.col(\"activity_type\"\
    ).rlike(\"(?i)Expense \\\\(Management Fee\\\\)\"), \"Expense\")\n        .when(F.col(\"activity_type\"\
    ).rlike(\"(?i)Expense \\\\(Management Fee\\\\)\"), \"Expense (Management Fee)\")\n        .otherwise(F.col(\"\
    activity_type\"))\n    )\n    .withColumn(\"reportingperiod\", F.last_day(F.col(\"entry_dt\")))\n\
    \    .withColumn(\"amount_num\", parse_money_like_amount(F.col(\"amount\")))\n    .where(F.col(\"\
    avactivitytype\").isNotNull())\n    .groupBy(to_bigint(\"avaccountuploadid\").alias(\"avaccountuploadid\"\
    ), \"avactivitytype\", \"reportingperiod\")\n    .agg(F.sum(F.col(\"amount_num\")).alias(\"amount\"\
    ))"
  functions: []
  comments: []
