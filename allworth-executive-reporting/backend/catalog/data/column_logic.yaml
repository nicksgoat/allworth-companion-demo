    ) &\n           (col(\"l.leadsource\").isin(\"External Referral\", \"Referral\", \"Internal Referral\"\
    )) &\n           (col(\"l.CreatedDate\") >= date_sub(current_date(), 365)) &\n           (col(\"a.Client_Since_Date__c\"\
    ).isNotNull())) \\\n    .groupBy(\"ra.Name\", \"ra.Id\") \\\n    .agg(countDistinct(\"l.Id\").alias(\"\
