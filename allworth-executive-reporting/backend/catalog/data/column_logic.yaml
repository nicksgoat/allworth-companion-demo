- table: tho_LoadMonthlyMetricsFact
  table_id: null
  column: amount
  notebook: tho_LoadMonthlyMetricsFact
  source_systems: *id030
  expression: ".when((col(\"measure\") == \"ECNM\") & (col(\"PlanPrivate\") != \"RPS\"),\n           \
    \   lit(\"New assets - Existing Clients\"))\n        .when((col(\"measure\") == \"Acquisition\"),\
    \ lit(\"Net Assets - Acquisition (incl RPS)\"))\n        .when(col(\"measure\").isin(\"NCNM\", \"\
    ECNM\") & (col(\"PlanPrivate\") == \"RPS\"),\n              lit(\"New assets - 401k plans\"))\n  \
    \      .when(col(\"measure\").isin(\"NCNM\", \"ECNM\", \"Acquisition\"),\n              lit(\"Total\
    \ New Assets\"))\n        .when(col(\"measure\").isin(\"Distribution\", \"Expenses\"), lit(\"WM Existing\
    \ client distributions, tax, expenses\"))\n        .when(col(\"measure\") == \"Attrition\", lit(\"\
    WM Client attrition\"))\n        .when(col(\"measure\").isin(\"Distribution\", \"Expenses\") & (col(\"\
    PlanPrivate\") == \"RPS\"),\n              lit(\"Employer plans 401k\"))\n        .when(col(\"measure\"\
    ) == \"Attrition\" & (col(\"PlanPrivate\") == \"RPS\"),\n              lit(\"Employer plans 401k -\
    \ Attrition\"))\n        .when(col(\"measure\").isin(\"Distribution\", \"Expenses\", \"Attrition\"\
    ),\n              lit(\"Total AUM Attrition\"))\n        .when(col(\"measure\") == \"Fees\", lit(\"\
    Management Fees\"))\n        .when(col(\"measure\") == \"Income\", lit(\"Dividend and Interest\"))\n\
    \        .when(col(\"measure\") == \"Ending AUM\", lit(\"Ending AUM\"))\n    ) \\\n    .filter(col(\"\
    mapped_measure\").isNotNull()) \\\n    .groupBy(\"reportingperiod\", \"mapped_measure\") \\\n    .agg(coalesce(_sum(\"\
    amount\"), lit(0.00)).alias(\"amount\")) \\"
  functions: []
  comments: []
