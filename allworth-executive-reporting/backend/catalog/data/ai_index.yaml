few_shot:
- q: What were our YTD net flows by region?
  sql: 'SELECT u.RD_Region, SUM(rf.NCNM + rf.ECNM - rf.Distribution - rf.Attrition) AS net_flows

    FROM tho.Household_Rollforward rf

    JOIN tho.Current_Household_Fact f  ON rf.avhhid = f.AVHHID

    JOIN tho."User" u                  ON f.advisorid = u.User_ID

    WHERE rf.reportingperiod >= DATEFROMPARTS(YEAR(GETDATE()),1,1)

    GROUP BY u.RD_Region;

    '
- q: Which households are at high churn risk with > $1M AUM?
  sql: 'SELECT d.LeadId, d.HHName, f.AUM, s.churn_risk_score, s.risk_category

    FROM tho.Current_Household_Demographic d

    JOIN tho.Current_Household_Fact f             ON d.AVHHID = f.AVHHID

    JOIN tho.Term_Prediction_Scoring_Model s      ON d.AVHHID = s.avhhid

    WHERE f.AUM > 1000000 AND s.risk_category = ''High''

    ORDER BY s.churn_risk_score DESC;

    '
