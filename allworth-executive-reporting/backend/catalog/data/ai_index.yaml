note: Compact schema catalog for LLM system-prompt injection. Generated from ThoughtSpot TML + schema_index.yaml.
glossary:
  AUM: Assets Under Management ($)
  PAUM: Projected AUM (current AUM + pipeline-weighted opportunities)
  VMAC: Variable Managed Account Value
  AVHHID: Advent Household ID (numeric, joins household across systems)
  HHID: Household ID (Salesforce-side, varchar)
  LeadId: Salesforce Lead ID (primary key of household demographic)
  NCNM: New Client Net Money (inflows from clients new in period)
  ECNM: Existing Client Net Money (inflows from existing clients)
  Net Flows: NCNM + ECNM - Distributions - Attrition
  Distribution: client withdrawal
  Attrition: outflow from terminated client
  Acquisition: assets from acquired books of business
  BoP / EoP: Beginning / End of Period AUM
  Rollforward: monthly snapshot reconciling BoP AUM to EoP AUM
  Trade Date RF: rollforward using trade date instead of settlement date
  CRP: Client Referral Program
  RPS: Retirement Plan Services
  PWS: Private Wealth Services
  RMD: Required Minimum Distribution
  Practice Management Score: count of services delivered (tax, estate, insurance, FP, annual review)
  Catchlight Score: third-party household wealth-propensity score
  Spice / Compass: marketing engagement platforms
  AdvisorKey / AdvisorTeam: rep grouping for goal aggregation
  RLS: Row-Level Security mapping (advisor -> visible offices/teams)
