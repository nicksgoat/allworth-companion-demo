# =============================================================================
# Hub tool registry — the SINGLE source of truth for /home.
# =============================================================================
# Adding an entry here automatically:
#   - creates a card on the /home hub (grouped by category)
#   - creates a sidebar nav item (under the category heading)
#
# When you add a new user-facing route to this app (Flask blueprint, React
# route, external URL), ADD AN ENTRY HERE so the hub picks it up. No template
# edits required.
#
# Schema per tool:
#   id:          required, unique slug (letters/digits/hyphens)
#   name:        required, display name shown on card + sidebar
#   kicker:      short uppercase label above the card title (e.g., "Dashboard")
#   description: 1-2 sentence blurb on the card
#   url:         absolute path (e.g., "/jarvis/") or full URL
#   host:        short display of the URL shown on the card footer ("—" for placeholders)
#   category:    live | analytics | utilities   (adds to a section on the hub)
#   color:       navy | orange | sky | slate | teal  (card icon gradient)
#   status:      live | soon | new
#   icon:        inline SVG path content (rendered inside a <svg> in the card)
#
# Order within a category is the order entries appear below.
# =============================================================================

