content: |
  # Rebalancing Policy

  ## Triggers
  1. **Calendar-based**: Review quarterly (end of Mar, Jun, Sep, Dec)
  2. **Threshold-based**: Rebalance when any asset class drifts ±5% from target
  3. **Cash-flow-based**: Direct new contributions/withdrawals to underweight classes
  4. **Event-based**: After large market moves (>10% index change in 30 days)

  ## Methodology
  - Rebalance to target allocation (not to band edge)
  - Minimize transaction count — batch trades
  - Use cash flows first before selling
  - Cross-lot tax optimization: sell highest-cost-basis lots first in taxable accounts
  - Respect wash sale rules (31-day window)

  ## Tax-Loss Harvesting
  - Harvest losses when a position is down >3% from cost basis
  - Replace with correlated but not substantially identical security
  - Track replacement positions for 31-day wash sale period
  - Annual tax-loss harvesting review in November

  ## Restrictions
  - No rebalancing within 7 days of quarter-end (compliance reporting)
  - Client-restricted securities honored
  - ESG/SRI constraints applied where specified in IPS

  ## Code Linkage
  - Drift detection: `risk.py:check_ips_compliance()` with default `drift_threshold = 0.05` (5%).
  - Minimum account value: $10,000 (skip smaller accounts).
  - Cash handling: configurable (`exclude_cash` parameter rescales target weights).
  - Each account's target model comes from `Rebalancing_Model_Name` on `Current_Account_Demographic`; targets themselves live in `Asset_Allocation_Security_Weights`.
  - Flag output separates overweight (`drift > 0`) from underweight (`drift < 0`) positions.

  Trade execution and tax-lot selection happen in the trading platform downstream, not in the MCP — the MCP only flags candidates.
